{% extends "base.html" %}
{% block title %}Sign up{% endblock %}
{% block content %}
<div class="max-w-md mx-auto mt-10">
  <h1 class="text-2xl font-bold">Create your account</h1>
  <p class="text-sm text-slate-400 mb-6">Start on the Free plan: 5 AI posts a month. Upgrade any time.</p>
  <form method="post" action="/signup" class="card grid gap-4"><input type="hidden" name="csrf" value="{{ csrf }}">
    <label class="text-sm">Your name or business<input name="display_name" class="input mt-1" placeholder="Taverna Nikos" maxlength="80"></label>
    <label class="text-sm">Email<input name="email" type="email" required autocomplete="email" class="input mt-1"></label>
    <label class="text-sm">Password <span class="text-slate-500">(8+ characters)</span><input name="password" type="password" required minlength="8" autocomplete="new-password" class="input mt-1"></label>
    <label class="text-sm">Repeat password<input name="password2" type="password" required minlength="8" autocomplete="new-password" class="input mt-1"></label>
    <button class="btn btn-primary justify-center">Create account</button>
  </form>
  <p class="text-sm text-slate-400 mt-4">Already have an account? <a href="/login" class="text-sky-300 hover:underline">Log in</a></p>
</div>
{% endblock %}
