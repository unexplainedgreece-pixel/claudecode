{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="max-w-md mx-auto mt-10">
  <h1 class="text-2xl font-bold">Log in</h1>
  <p class="text-sm text-slate-400 mb-6">Welcome back.</p>
  <form method="post" action="/login" class="card grid gap-4">
    <input type="hidden" name="next" value="{{ next or '/' }}">
    <label class="text-sm">Email<input name="email" type="email" required autocomplete="email" class="input mt-1"></label>
    <label class="text-sm">Password<input name="password" type="password" required autocomplete="current-password" class="input mt-1"></label>
    <button class="btn btn-primary justify-center">Log in</button>
  </form>
  <p class="text-sm text-slate-400 mt-4">No account yet? <a href="/signup" class="text-sky-300 hover:underline">Create one</a></p>
</div>
{% endblock %}
